
    <div class="neubrutalism-scroll-rail-layout" style="display: flex; min-height: 100vh; width: 100%">
      <div id="neubrutalism-main-rail" class="neubrutalism-scroll-rail" style="position: sticky; top: 0px; width: 280px; height: calc(100vh - 0px - 0px); max-height: calc(100vh - 0px - 0px); flex-shrink: 0; overflow-y: auto; overflow-x: hidden; background: var(--nb-paper, var(--card)); border-right: var(--nb-border-thin, 2px) solid var(--nb-line, #000); scrollbar-width: thin; scrollbar-color: var(--nb-accent, var(--primary)) transparent">
        <div style="padding: 1rem; min-height: 100%"><span class="arcane-text">content</span></div>
        <script>
                      (function() {
                        var rail = document.getElementById('neubrutalism-main-rail');
                        if (!rail) return;
                        var storageKey = 'scroll-rail-neubrutalism-main-rail';
                        var savedPos = sessionStorage.getItem(storageKey);
                        if (savedPos) rail.scrollTop = parseInt(savedPos, 10);
                        var saveTimeout;
                        rail.addEventListener('scroll', function() {
                          clearTimeout(saveTimeout);
                          saveTimeout = setTimeout(function() {
                            sessionStorage.setItem(storageKey, rail.scrollTop.toString());
                          }, 100);
                        });
                      })();
                    
        </script>
      </div>
      <div class="neubrutalism-scroll-rail-content" style="flex: 1; min-width: 0; background: var(--background)"><span class="arcane-text">content</span></div>
    </div>
