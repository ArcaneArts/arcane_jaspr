name: arcane_jaspr_win95
description: Windows 95 renderer package for Arcane Jaspr.
version: 3.3.0
homepage: https://arcanearts.github.io/arcane_jaspr/
documentation: https://arcanearts.github.io/arcane_jaspr/
repository: https://github.com/ArcaneArts/arcane_jaspr

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  arcane_jaspr: ^3.3.0
  arcane_lexicon: ^1.3.0
  jaspr: '>=0.23.1 <1.0.0'

dev_dependencies:
  lints: ^6.1.0

# arcane_lexicon is unpublished; resolve from the sibling checkout for local
# dev/test. Publish arcane_lexicon (or use a git ref) for CI and pub publish.
dependency_overrides:
  arcane_lexicon:
    path: ../../../arcane_lexicon
